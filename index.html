<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prepare for the Capgemini campus hiring assessment. Practice English communication, technical MCQs, pseudocode tracing, and coding problems to qualify for higher-package 7 LPA roles." />
    <title>Capgemini Prep Arena | Higher-Package Assessment Preparation Platform</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('capgemini-prep:theme');
          var isDark = saved === 'dark' || (saved === 'system' || !saved) && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
